const imgs={};let region='forest',tick=0;const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
const names={forest:'森林村庄',lake:'湖岸与码头',cave:'水晶洞穴',tower:'雷电遗迹',shared:'通用构件'};
const descriptions={forest:'苔绿色树冠、木屋和草木细节，营造可停留的村庄空间。',lake:'青绿远岸、木码头、系船桩、独木舟与睡莲，保持清晰的岸线。',cave:'冷色岩层、水晶与发光蘑菇，前景边缘清楚，背景保持低对比。',tower:'灰紫砖石配黄铜机械、雷纹旗帜与暖色火光，机关外观等待系统接入。',shared:'16×16 木质与石质边条，可用于平台、建筑边框或场景接缝。'};
function blit(k,x,y,w,h){const im=imgs[k];if(im)ctx.drawImage(im,Math.round(x),Math.round(y),w||im.width,h||im.height)}
function fill(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function drawScene(which=region){
 const r=which==='shared'?'tower':which;ctx.save();ctx.scale(2,2);
 const gradient=ctx.createLinearGradient(0,0,0,224);gradient.addColorStop(0,{forest:'#708f97',lake:'#6f9da9',cave:'#112534',tower:'#242737'}[r]);gradient.addColorStop(1,{forest:'#c4cfaf',lake:'#c6d9bd',cave:'#294e60',tower:'#484354'}[r]);ctx.fillStyle=gradient;ctx.fillRect(0,0,384,224);
 for(let l=0;l<3;l++){const offset=Math.floor(tick*.025*[.12,.23,.38][l])%384;blit('backgrounds/env_'+r+'_layer_'+l,-offset,0);blit('backgrounds/env_'+r+'_layer_'+l,384-offset,0)}
 const ground=r==='forest'?176:r==='lake'?176:192;
 const tile=r==='forest'?'forest_dirt_':r==='lake'?'biome_shore_':r==='cave'?'biome_cave_':'biome_tower_';
 for(let y=ground;y<224;y+=16)for(let x=0;x<384;x+=16){if(r==='lake'&&x>=96&&x<288)continue;blit('tiles/'+tile+((x/16+y/16)%4),x,y)}
 if(r==='forest'){
  for(let x=0;x<384;x+=16)blit('tiles/forest_grass_'+x/16%4,x,176);
  blit('deco/forest_tree_0',8,64);blit('deco/forest_tree_1',294,64);blit('deco/env_village_cottage',104,96);
  for(let x=212;x<280;x+=32)blit('deco/env_fence',x,160);
  blit('deco/env_bench',238,144);blit('deco/env_planter',85,144);blit('deco/env_signpost',203,128);blit('deco/env_stump',37,144);blit('deco/env_fern',16,152);blit('deco/env_berry_bush',316,152);blit('reference/eevee',218,158);
 }else if(r==='lake'){
  for(let x=0;x<384;x+=16){if(x<96||x>=288)blit('tiles/forest_grass_'+x/16%4,x,176)}
  blit('deco/biome_reeds',30,144);blit('deco/biome_reeds',320,144);blit('deco/env_pier',80,160);blit('deco/env_pier',128,160);blit('deco/env_mooring_post',90,145);blit('deco/env_canoe',176,155);blit('deco/env_waterweed',245,184);blit('deco/env_river_stones',292,160);
  for(let y=180;y<224;y+=16)for(let x=96;x<288;x+=16)blit('tiles/biome_lake_water',x,y);
  blit('deco/env_lily_'+Math.floor(tick/20)%3,240,171);blit('reference/vaporeon',131,150);
 }else if(r==='cave'){
  for(let x=0;x<384;x+=16)blit('tiles/biome_cave_'+x/16%4,x,0);
  blit('deco/env_crystal_cluster',274,128);blit('deco/env_boulder',205,168);blit('deco/env_stalagmite',25,144);blit('deco/env_stalactite',90,16);blit('deco/env_stalactite',294,16);blit('deco/biome_vine',176,16);blit('deco/env_glow_mushrooms',113,168);blit('deco/env_glow_mushrooms',334,168);blit('deco/biome_crystal_1',68,160);blit('reference/eevee',178,174);
 }else{
  for(let y=0;y<192;y+=16){blit('tiles/biome_tower_0',0,y);blit('tiles/biome_tower_1',368,y)}
  for(let x=0;x<384;x+=16)blit('tiles/biome_tower_'+x/16%4,x,0);
  blit('deco/env_grate',174,144);blit('deco/biome_pillar',48,144);blit('deco/biome_pillar',310,144);blit('deco/biome_banner',64,16);blit('deco/biome_banner',292,16);blit('deco/env_coil',100,144);blit('deco/env_gear',245,135);blit('deco/env_lever',280,160);blit('deco/env_torch_'+Math.floor(tick/8)%4,38,65);blit('deco/env_torch_'+Math.floor(tick/8)%4,330,65);blit('reference/eevee',220,174);
 }
 ctx.restore();
}
function show(next){region=next;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.region===next));document.getElementById('description').textContent=descriptions[next];const root=document.getElementById('catalog');root.replaceChildren();for(const [type,label]of [['deco','装饰与建筑'],['tiles','地形瓦片'],['backgrounds','视差背景层']]){const list=manifest.assets.filter(a=>a.region===region&&a.category===type);if(!list.length)continue;const h=document.createElement('h2');h.textContent=label;root.append(h);const grid=document.createElement('div');grid.className='grid';root.append(grid);for(const a of list){const card=document.createElement('div');card.className='card';const box=document.createElement('div');box.className='image';const img=imgs[a.id].cloneNode();img.alt=a.id;img.style.width=(a.width*(a.width>96?.43:a.height>48?1.5:3))+'px';box.append(img);const p=document.createElement('p');p.textContent=a.id;const br=document.createElement('br'),span=document.createElement('span');span.textContent=a.width+'×'+a.height+' · 锚点 '+a.anchor.join(',');p.append(br,span);card.append(box,p);grid.append(card)}}drawScene()}
for(const [key,name]of Object.entries(names)){const b=document.createElement('button');b.textContent=name;b.dataset.region=key;b.onclick=()=>show(key);document.getElementById('tabs').append(b)}
document.getElementById('light').onchange=e=>document.body.classList.toggle('light',e.target.checked);
document.getElementById('stats').textContent=manifest.assets.length+' 张场景素材 / '+manifest.animations.length+' 组动画';
Promise.all(Object.entries(data).map(([k,v])=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{imgs[k]=im;resolve()};im.onerror=reject;im.src=v}))).then(()=>{show('forest');let last=0;function loop(t){if(t-last>1000/30){tick=t/1000*60;drawScene();last=t}requestAnimationFrame(loop)}requestAnimationFrame(loop)});
</script></html>
