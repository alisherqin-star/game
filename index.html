<style>
  html, body { margin: 0; padding: 0; background: #0f1024; height: 100%; overflow: hidden; touch-action: none;

  #bJ { right: max(18px, env(safe-area-inset-right)); width: 84px; height: 84px; }

function bake(rows, pal, flip) {
  const w = rows[0].length, h = rows.length;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const ch = rows[y][x]; if (ch === '.' || ch === ' ') continue;
    g.fillStyle = pal[ch] || '#f0f'; g.fillRect(flip ? w - 1 - x : x, y, 1, 1);
  }
  return c;
}

const SHINY_RATE = 1 / 8;   // 每次进化变成闪光版的概率
const IMG = {};             // IMG[form][shiny ? 1 : 0] = { 1: canvas, -1: canvas }
function bakeImage(img) {
  const make = (flip) => { const c = document.createElement('canvas'); c.width = img.width; c.height = img.height; const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
    if (flip) { g.translate(img.width, 0); g.scale(-1, 1); } g.drawImage(img, 0, 0); return c; };
  return { 1: make(false), '-1': make(true) };
}
for (const f in SPRITE_PNG) {
  IMG[f] = {};
  [['normal', 0], ['shiny', 1]].forEach(([k, i]) => { if (!SPRITE_PNG[f][k]) return; const img = new Image(); img.onload = () => { IMG[f][i] = bakeImage(img); }; img.src = SPRITE_PNG[f][k]; });
}
// 可选的外部素材：把 assets/<形态>.png（朝右、脚贴底）放进去即可替换内置角色图。
// 可以是单张图，也可以是横向两帧的走路图（宽度为两帧拼接）。
const EXT = {};
function tryLoadExternal(form) {
  const img = new Image();
  img.onload = () => {
    const fw = img.width >= img.height * 1.8 ? img.width / 2 : img.width, fh = img.height;
    const frames = img.width >= img.height * 1.8 ? 2 : 1;
    EXT[form] = {};
    for (let w = 0; w < 2; w++) {
      const fi = Math.min(w, frames - 1);
      const make = (flip) => { const c = document.createElement('canvas'); c.width = fw; c.height = fh; const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
        if (flip) { g.translate(fw, 0); g.scale(-1, 1); } g.drawImage(img, fi * fw, 0, fw, fh, 0, 0, fw, fh); return c; };
      EXT[form][w] = { 1: make(false), '-1': make(true) };
    }
    EXT[form].anim = frames;
  };
  img.onerror = () => { };
  img.src = 'assets/' + form + '.png';
}

function spriteOf(form, walk, facing, shiny) {
  if (EXT[form]) return EXT[form][walk][facing];
  if (IMG[form] && (IMG[form][shiny ? 1 : 0] || IMG[form][0])) return (IMG[form][shiny ? 1 : 0] || IMG[form][0])[facing];
  return SPRITES[form][walk][facing];
}

    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), actx.currentTime + dur);
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
  } catch (e) { }
}

  const up = e => { e.preventDefault(); keys[key] = false; el.classList.remove('on'); };
  el.addEventListener('touchstart', down, { passive: false }); el.addEventListener('touchend', up, { passive: false }); el.addEventListener('touchcancel', up, { passive: false });

  y0 = Math.floor(ent.y / T); y1 = Math.floor((ent.y + ent.h - 0.01) / T);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {

// ---------------- 玩家逻辑 ----------------

function updatePlayer() {

  if (right()) { target = RUN * speedMul; p.facing = 1; }

    } else {

  ui.style.width = w + 'px'; ui.style.height = h + 'px';
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  ui.width = Math.round(w * dpr); ui.height = Math.round(h * dpr);
  UIS = ui.width / CW;
}
window.addEventListener('resize', fit); window.addEventListener('orientationchange', () => setTimeout(fit, 100)); fit();
resetGame(); state = 'title';
requestAnimationFrame(loop);
</script>
</body>
