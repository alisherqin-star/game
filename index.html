  put(EARS[def.ears]); put(TAILS[def.tail]);
  ACCENT[form].forEach(([r, str, c]) => str.split('').forEach((ch, i) => { g[r][c + i] = ch; }));
  return g;
}
// 把像素字符串画成离屏画布
function bake(rows, pal, flip) {
  const w = rows[0].length, h = rows.length;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const ch = rows[y][x]; if (ch === '.' || ch === ' ') continue;
    g.fillStyle = pal[ch] || '#f0f'; g.fillRect(flip ? w - 1 - x : x, y, 1, 1);
  }
  return c;
}

  SPRITES[f] = {};

}

  const img = new Image();
  img.onload = () => {
    const fw = img.width >= img.height * 1.8 ? img.width / 2 : img.width, fh = img.height;
    const frames = img.width >= img.height * 1.8 ? 2 : 1;
    EXT[form] = {};
    for (let w = 0; w < 2; w++) {
      const fi = Math.min(w, frames - 1);
      const make = (flip) => { const c = document.createElement('canvas'); c.width = fw; c.height = fh; const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
        if (flip) { g.translate(fw, 0); g.scale(-1, 1); } g.drawImage(img, fi * fw, 0, fw, fh, 0, 0, fw, fh); return c; };
      EXT[form][w] = { 1: make(false), '-1': make(true) };
    }
  };
  img.onerror = () => { };
  img.src = 'assets/' + form + '.png';
}

// 瓦片：'=' 草地顶  '#' 泥土  'b' 砖块  'W' 木箱  '~' 水  'E' 电网  'S' 黑影墙
const LW = 268;
let grid, coins, enemies, foods, signs, flag, startPos;

    const cx = R(((i * 90 + 30 - camX * 0.5 - frame * 0.05) % (CW + 60) + CW + 60) % (CW + 60) - 30), cy = 20 + (i % 3) * 18;
    px(cx, cy + 4, 28, 6, '#fff'); px(cx + 6, cy, 12, 4, '#fff'); px(cx + 4, cy + 10, 20, 2, '#e0f0ff'); px(cx + 18, cy + 2, 6, 2, '#fff');
  }
}
function drawLevel() {
  const x0 = Math.max(0, Math.floor(camX / T)), x1 = Math.min(LW - 1, Math.floor((camX + CW) / T) + 1);
  for (let y = 0; y < H; y++) for (let x = x0; x <= x1; x++) { const t = grid[y][x]; if (t !== ' ' && t !== '~') drawTile(t, x, y); }
  for (const s of signs) { const sx = R(s.x * T - camX + 2); if (sx > -20 && sx < CW + 20) ctx.drawImage(SIGN_SPR, sx, 10 * T - 12); }
  const fx = R(flag.x - camX);
  if (fx > -30 && fx < CW + 30) {
    px(fx + 6, flag.y, 2, 10 * T - flag.y, '#d0d0d0'); px(fx + 6, flag.y, 1, 10 * T - flag.y, '#f0f0f0');
    const wave = (frame >> 3) & 1;
    px(fx + 8, flag.y + 1, 10, 7, '#e53e5e'); px(fx + 18, flag.y + 2 + wave, 3, 5 - wave, '#e53e5e'); px(fx + 9, flag.y + 2, 4, 2, '#ffd84a');
    px(fx + 5, flag.y - 3, 4, 3, '#ffd84a');
  }
  for (const c of coins) {
    if (c.taken) continue; const cx = R(c.x - camX); if (cx < -10 || cx > CW + 10) continue;
    const f = ((frame >> 3) + Math.floor(c.x / 16)) & 1;
    ctx.drawImage(COIN_SPR[f], cx - 4, R(c.y - 4 + Math.sin(frame / 15 + c.x) * 1));
  }
  for (const f of foods) { if (f.taken) continue; const fx2 = R(f.x - camX); if (fx2 < -16 || fx2 > CW + 16) continue; ctx.drawImage(FOOD_SPR[f.type], fx2 - 6, R(f.y - 6 + Math.sin(frame / 14 + f.x) * 2)); }
  for (const e of enemies) {
    if (!e.alive) continue; const ex = R(e.x - camX); if (ex < -20 || ex > CW + 20) continue;
    ctx.drawImage(ENEMY_SPR[(e.t >> 3) & 1][e.vx > 0 ? 1 : -1], ex, R(e.y));
  }
}
function drawWater() {
  const x0 = Math.max(0, Math.floor(camX / T)), x1 = Math.min(LW - 1, Math.floor((camX + CW) / T) + 1);
  ctx.globalAlpha = 0.6;
  for (let y = 0; y < H; y++) for (let x = x0; x <= x1; x++) if (grid[y][x] === '~') drawTile('~', x, y);
  ctx.globalAlpha = 1;
}
function drawParticles() {
  for (const q of particles) {
    if (q.heart) { px(q.x - camX - 1, q.y, 1, 1, q.color); px(q.x - camX + 1, q.y, 1, 1, q.color); px(q.x - camX - 1, q.y + 1, 3, 1, q.color); px(q.x - camX, q.y + 2, 1, 1, q.color); }
    else px(q.x - camX, q.y, q.life > 10 ? 2 : 1, q.life > 10 ? 2 : 1, q.color);
  }
}
function drawPlayer() {
  const p = player;
  if (p.invuln > 0 && (frame >> 2) & 1 && state === 'play') return;
  const walk = p.onGround && Math.abs(p.vx) > 0.2 ? (Math.floor(p.anim / 4) & 1) : (p.onGround ? 0 : 1);
  const spr = spriteOf(p.form, walk, p.facing);
  const sx = R(p.x + p.w / 2 - spr.width / 2 - camX), sy = R(p.y + p.h - spr.height);
  if (p.form === 'umbreon') { ctx.globalAlpha = 0.15; px(sx - 6, sy - 4, spr.width + 12, spr.height + 6, '#f5d442'); ctx.globalAlpha = 1; }
  if (p.form === 'espeon' && p.gliding) { ctx.globalAlpha = 0.4; px(sx - 2, sy - 2 + ((frame >> 2) & 1), spr.width + 4, 1, '#f2c8ff'); px(sx - 2, sy + spr.height, spr.width + 4, 1, '#f2c8ff'); ctx.globalAlpha = 1; }
  ctx.drawImage(spr, sx, sy);
  if (p.form === 'jolteon' && Math.abs(p.vx) > 1.7 && frame % 3 === 0) particles.push({ x: p.x + p.w / 2 - p.facing * 6, y: p.y + p.h - 3, vx: -p.facing * 0.8, vy: -0.4, life: 12, color: '#ffe94a' });
  if (p.inWater && p.form !== 'vaporeon') {
    const bx = R(p.x + p.w / 2 - camX - 8), by = R(p.y - 8);
    px(bx, by, 16, 3, '#1a1a2a'); px(bx + 1, by + 1, R(14 * Math.max(0, p.breath)), 1, p.breath > .3 ? '#4ad0ff' : '#ff4a4a');
  }
}
// 文字（带像素描边）
function text(str, x, y, size, color, align = 'left', outline = '#1a1020') {
  const S = UIS;
  uctx.font = `bold ${Math.round(size * S)}px sans-serif`; uctx.textAlign = align; uctx.textBaseline = 'top';
  const X = Math.round(x * S), Y = Math.round(y * S), o = Math.max(1, Math.round(S * 0.4));
  uctx.globalAlpha = ctx.globalAlpha;
  if (outline) { uctx.fillStyle = outline; uctx.fillText(str, X + o, Y); uctx.fillText(str, X - o, Y); uctx.fillText(str, X, Y + o); uctx.fillText(str, X, Y - o); }
  uctx.fillStyle = color; uctx.fillText(str, X, Y);
  uctx.globalAlpha = 1;
}
function textWidth(str, size) { uctx.font = `bold ${Math.round(size * UIS)}px sans-serif`; return uctx.measureText(str).width / UIS; }
function panel(x, y, w, h) { px(x, y, w, h, '#1a1030'); px(x + 1, y + 1, w - 2, h - 2, '#2c2050'); px(x + 1, y + 1, w - 2, 1, '#5a4a8a'); }
function drawHUD() {
  panel(3, 3, 132, 30);
  for (let i = 0; i < 5; i++) ctx.drawImage(i < lives ? HEART_SPR.full : HEART_SPR.empty, 7 + i * 9, 7);
  ctx.drawImage(COIN_SPR[0], 56, 6); text('' + coinCount, 66, 5, 9, '#ffd84a', 'left', null);
  text('分数 ' + score, 88, 5, 9, '#fff', 'left', null);
  px(7, 18, 8, 8, FORM_COLOR[player.form]);
  text(FORMS[player.form].name, 18, 17, 9, '#fff', 'left', null);
  text(FORMS[player.form].ability, 56, 18, 7, '#cfd8ff', 'left', null);
  panel(CW - 3 - 8 * 15 - 6, 3, 8 * 15 + 6, 22);
  FORM_ORDER.forEach((f, i) => {
    const x = CW - 3 - 8 * 15 - 6 + 4 + i * 15, got = discovered[f];
    px(x, 6, 10, 8, got ? FORM_COLOR[f] : '#3a3050');
    if (player.form === f) { px(x - 1, 5, 12, 1, '#fff'); px(x - 1, 14, 12, 1, '#fff'); px(x - 1, 5, 1, 10, '#fff'); px(x + 10, 5, 1, 10, '#fff'); }
    text(got ? FORMS[f].name.replace('伊布', '') : '?', x + 5, 15, 7, got ? '#fff' : '#8a80a0', 'center', null);
  });
  for (const s of signs) {
    if (Math.abs(s.x * T + 8 - (player.x + player.w / 2)) < 44) {
      const w = Math.ceil(textWidth(s.text, 9)) + 12;
      const bx = Math.max(4, Math.min(CW - w - 4, R(s.x * T + 8 - camX - w / 2))), by = 10 * T - 40;
      px(bx, by, w, 16, '#4a2a10'); px(bx + 1, by + 1, w - 2, 14, '#fff4d8');
      text(s.text, bx + 6, by + 3, 9, '#4a2a10', 'left', null);
    }
  }
  for (const f of floaters) { ctx.globalAlpha = Math.min(1, f.life / 15); text(f.text, f.x - camX, f.y - 8, 8, f.color, 'center'); }
  ctx.globalAlpha = 1;
}
function drawOverlay(title, lines, sub) {
  ctx.globalAlpha = 0.75; px(0, 0, CW, CH, '#0a0a28'); ctx.globalAlpha = 1;
  text(title, CW / 2, 40, 24, '#fff', 'center');
  lines.forEach((l, i) => text(l, CW / 2, 80 + i * 16, 10, '#fff', 'center'));
  if (sub) text(sub, CW / 2, CH - 30, 10, (frame >> 4) & 1 ? '#ffd23c' : '#fff', 'center');
}

// ---------------- 主循环 ----------------
function update() {
  frame++;
  if (state === 'play') { updatePlayer(); updateEnemies(); }
  else if (state === 'evolving') {
    evo.t++;
    if (evo.t === 50) { player.form = evo.to; discovered[evo.to] = true; }
    if (evo.t % 3 === 0) particles.push({ x: player.x + player.w / 2 + (Math.random() - .5) * 24, y: player.y + player.h - Math.random() * 24, vx: (Math.random() - .5) * 0.4, vy: -0.4 - Math.random() * 0.8, life: 40, color: ['#fff', '#ffe14a', FORM_COLOR[evo.to]][evo.t % 3] });
    if (evo.t > 120) { state = 'play'; jumpQueued = false; }
  } else if (state === 'dead') {
    deathTimer++;
    player.vy += GRAVITY; player.y += player.vy;
    if (deathTimer > 70) { if (lives > 0) respawn(); else state = 'over'; }
  }
  updateBurning();
  updateParticles();
  const targetCam = player.x + player.w / 2 - CW * 0.4;
  camX += (targetCam - camX) * 0.12;
  camX = Math.max(0, Math.min(LW * T - CW, camX));
}
let titleAnim = 0;
function draw() {
  uctx.clearRect(0, 0, ui.width, ui.height);
  if (state === 'title') {
    titleAnim += 0.08; camX = 0;
    drawBackground();
    for (let x = 0; x < CW; x += 16) { drawTile('=', x / 16, 10); for (let y = 11; y < H; y++) drawTile('#', x / 16, y); }
    ['eevee', ...FORM_ORDER].forEach((f, i) => {
      const x = 22 + i * 42, y = 10 * T - Math.round(Math.abs(Math.sin(titleAnim + i * 0.5)) * 8);
      const spr = spriteOf(f, Math.floor(titleAnim * 2 + i) & 1, 1);
      ctx.drawImage(spr, x - Math.floor(spr.width / 2), y - spr.height);
      text(FORMS[f].name, x, 10 * T + 8, 7, '#fff', 'center');
    });
    text('伊布马里奥', CW / 2, 30, 28, '#ffd23c', 'center');
    text('进化大冒险', CW / 2, 64, 12, '#fff', 'center');
    text('吃下不同的食物，伊布会进化成不同的形态', CW / 2, 92, 9, '#fff', 'center');
    text('← → / A D 移动   空格 / ↑ / W 跳跃   R 重新开始', CW / 2, 106, 8, '#dfe7ff', 'center');
    text('按任意键 / 点击屏幕开始', CW / 2, 128, 10, (frame >> 4) & 1 ? '#fff' : '#ffd23c', 'center');
    return;
  }
  drawBackground();
  drawLevel();
  drawPlayer();
  drawWater();
  drawParticles();
  drawHUD();
  if (state === 'evolving') {
    const t = evo.t;
    const flash = t > 40 && t < 60 ? 1 - Math.abs(t - 50) / 10 : 0;
    ctx.globalAlpha = flash * 0.9; px(0, 0, CW, CH, '#fff'); ctx.globalAlpha = 1;
    const msg = t < 50 ? '咦？伊布的样子……' : `${FORMS[evo.from].name} 进化成了 ${FORMS[evo.to].name}！`;
    text(msg, CW / 2, 44, 14, t < 50 ? '#fff' : '#ffd23c', 'center');
    if (t >= 50) text('新能力：' + FORMS[evo.to].ability, CW / 2, 64, 9, '#fff', 'center');
  }
  if (state === 'over') drawOverlay('游戏结束', ['分数 ' + score, '发现了 ' + Object.keys(discovered).length + ' / 9 种伊布'], '按任意键回到标题');
  if (state === 'win') {
    const secs = Math.round((timeEnd - timeStart) / 1000);
    drawOverlay('通关！', ['分数 ' + score + '   用时 ' + secs + ' 秒', '金币 ' + coinCount + '   发现了 ' + Object.keys(discovered).length + ' / 9 种伊布', '伊布和它的所有进化形态一起抵达了终点！'], '按任意键回到标题');
    ['eevee', ...FORM_ORDER].forEach((f, i) => { if (discovered[f]) { const spr = spriteOf(f, (frame >> 3) & 1, 1); ctx.drawImage(spr, 30 + i * 38, 166 - spr.height - ((frame >> 3) + i) % 2); } });
  }
}
let last = 0, acc = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  if (!last) last = ts;
  acc += Math.min(100, ts - last); last = ts;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  draw();
}
// 自适应：桌面用整数倍放大保持像素整齐；小屏幕（手机）允许非整数倍以尽量铺满
function fit() {
  const raw = Math.min(window.innerWidth / CW, window.innerHeight / CH);
  const s = raw >= 2 ? Math.floor(raw) : raw;
  const w = Math.floor(CW * s), h = Math.floor(CH * s);
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  ui.style.width = w + 'px'; ui.style.height = h + 'px';
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  ui.width = Math.round(w * dpr); ui.height = Math.round(h * dpr);
  UIS = ui.width / CW;
}
window.addEventListener('resize', fit); window.addEventListener('orientationchange', () => setTimeout(fit, 100)); fit();
resetGame(); state = 'title';
requestAnimationFrame(loop);
</script>
