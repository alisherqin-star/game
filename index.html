<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1024">
<title>伊布 · 进化大冒险</title>
<style>
  html, body { margin: 0; padding: 0; background: #0f1024; height: 100%; overflow: hidden; touch-action: none;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; }
  #c { display: block; background: #000; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
  #ui { position: absolute; left: 0; top: 0; pointer-events: none; }
  #touch { position: fixed; inset: 0; pointer-events: none; display: none; }
  @media (hover: none) and (pointer: coarse) { #touch { display: block; } }
  .btn { position: absolute; width: 64px; height: 64px; background: rgba(255,255,255,.18);
    border: 3px solid rgba(255,255,255,.75); color: #fff; font-size: 24px; font-weight: bold; display: flex; align-items: center; justify-content: center;
    pointer-events: auto; touch-action: none; }
  .btn:active, .btn.on { background: rgba(255,255,255,.5); }
  #bL { left: max(18px, env(safe-area-inset-left)); bottom: max(18px, env(safe-area-inset-bottom)); } #bR { left: calc(max(18px, env(safe-area-inset-left)) + 80px); bottom: max(18px, env(safe-area-inset-bottom)); }
  #bJ { right: max(18px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom)); width: 84px; height: 84px; }
  #bS { right: calc(max(18px, env(safe-area-inset-right)) + 100px); bottom: max(18px, env(safe-area-inset-bottom)); width: 64px; height: 64px; }
  #bF { right: max(18px, env(safe-area-inset-right)); top: 46vh; width: 48px; height: 48px; font-size: 16px; }
  #bM { right: calc(max(18px, env(safe-area-inset-right)) + 58px); top: 46vh; width: 48px; height: 48px; font-size: 16px; }
  #bI { right: calc(max(18px, env(safe-area-inset-right)) + 116px); top: 46vh; width: 48px; height: 48px; font-size: 16px; }
  #rotate { position: fixed; inset: 0; background: #0f1024; color: #fff; display: none; flex-direction: column; align-items: center; justify-content: center; font-size: 20px; z-index: 10; text-align: center; line-height: 1.8; }
  @media (hover: none) and (pointer: coarse) and (orientation: portrait) { #rotate { display: flex; } }
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="c" width="384" height="224"></canvas><canvas id="ui"></canvas></div></div>
<div id="touch">
  <div class="btn" id="bL">◀</div>
  <div class="btn" id="bR">▶</div>
  <div class="btn" id="bJ">跳</div>
  <div class="btn" id="bS">技</div>
  <div class="btn" id="bF">形态</div>
  <div class="btn" id="bM">地图</div>
  <div class="btn" id="bI">背包</div>
</div>
<div id="rotate"><div style="font-size:48px">📱↻</div>请把手机横过来玩<br><span style="font-size:14px;opacity:.7">左下角移动，右下角跳跃，点左上角物品栏切换形态，右上角地图 / 背包，跳跃键左边是技能</span></div>

    if (it.kind === 'coin') { slotIcon(IMG['ui/coin_0'], r.x, r.y, r.s); stackNum(it.n, r.x, r.y, r.s); if (inRect(r, mouse.x, mouse.y)) hover = () => tooltip([['金币', '#ffd84a', 8], ['共 ' + it.n + ' 枚'], ['死亡会掉一半，以后可以在村里花', '#c8c8d8']]); }
  }
  // 角色面板（格子下方）
  const px0 = INV.x, y0 = INV.y + 5 * (INV.s + INV.gap) + 3, w = 10 * (INV.s + INV.gap) - INV.gap;
  panelBox(px0, y0, w, 44);
  const im = charSprite(player.form, player.shiny, 1); if (im) { const sc = Math.min(1.6, 36 / im.height, 40 / im.width); U.img(im, px0 + 26 - im.width * sc / 2, y0 + 22 - im.height * sc / 2, sc); }
  const visited = WORLD.rooms.filter(r => G.visited[r.id]).length;
  const stats = [['生命 ' + G.hp + ' / ' + G.maxHp, '#ff9ab0'], ['形态 ' + FORM_ORDER.filter(f => G.unlocked[f]).length + ' / 9', '#ffffff'], ['探索 ' + visited + ' / ' + WORLD.rooms.length + ' 个房间', '#9cf09c'], ['游玩 ' + Math.floor(G.time / 3600) + ' 分钟', '#c8c8d8']];
  text(FORMS[player.form].name + (player.shiny ? ' ✨' : ''), px0 + 54, y0 + 4, 8, player.shiny ? '#ffe96a' : '#ffffff');
  stats.forEach((l, i) => text(l[0], px0 + 54 + (i % 2) * 74, y0 + 17 + Math.floor(i / 2) * 11, 7, l[1]));
  if (hover) hover();
}
// ---- 全屏地图 ----
function drawMapScreen() {
  U.box(0, 0, CW, CH, 0, '#05060f');
  drawMapRegion(0, 0, CW, CH, mapView.cx, mapView.cy, mapView.zoom);
  const r = WORLD.rooms.find(r => mapView.cx >= r.x && mapView.cx < r.x + r.w && mapView.cy >= r.y && mapView.cy < r.y + r.h);
  if (r && G.visited[r.id]) text((REGION[r.region] ? REGION[r.region].name + ' · ' : '') + r.name, CW / 2, 6, 9, '#ffffff', 'center');
  U.box(0, CH - 14, CW, 14, 0, 'rgba(10,12,32,0.8)');
  text('方向键 移动地图    + / - 或滚轮 缩放（' + mapView.zoom + 'x）    M / Esc 关闭', CW / 2, CH - 11, 7, '#c8d0ff', 'center');
}
// ---- 主 HUD ----
function drawHUD() {
  for (const f of floaters) { ctx.globalAlpha = Math.min(1, f.life / 15); text(f.text, f.x - camX, f.y - 8 - camY, 8, f.color, 'center'); }
  ctx.globalAlpha = 1;
  if (state === 'inv') { U.box(0, 0, CW, CH, 0, 'rgba(0,0,0,0.25)'); drawInventory(); drawLife(); drawMinimap(); drawChat(); return; }
  drawHotbar(); drawSkillBuff(); drawLife(); drawMinimap(); drawBossBar(); drawDialog(); drawChat();
  for (let i = 0; i < FORM_ORDER.length; i++) if (inRect(hotbarRect(i), mouse.x, mouse.y)) formTooltip(FORM_ORDER[i]);
}
// ---- 点击 ----
function uiClick(mx, my) {
  if (state === 'title') { if (menu.help) { menu.help = false; return; } menuItems().forEach((m, i) => { const y = MENU_Y + i * 17; if (my >= y - 2 && my <= y + 12 && Math.abs(mx - CW / 2) < 60) { menu.idx = i; menuSelect(i); } }); return; }
  if (state === 'play') { for (let i = 0; i < FORM_ORDER.length; i++) if (inRect(hotbarRect(i), mx, my)) { selectForm(FORM_ORDER[i]); return; } }
  if (state === 'inv') { for (let c = 0; c < FORM_ORDER.length; c++) if (inRect(invRect(0, c), mx, my)) { selectForm(FORM_ORDER[c]); return; } }
}
// ---- 标题菜单 ----
function menuItems() { return hasSave() ? ['继续游戏', '新游戏', '操作说明'] : ['开始游戏', '操作说明']; }
function menuSelect(i) {
  const it = menuItems()[i];
  if (it === '继续游戏') startGame(loadGame() || newProgress());
  else if (it === '新游戏' || it === '开始游戏') { try { localStorage.removeItem(SAVE_KEY); } catch (e) { } startGame(newProgress()); }
  else menu.help = true;
  SFX.coin();
}
function titleKey(k) {
  if (state !== 'title') return;
  if (menu.help) { menu.help = false; return; }
  const n = menuItems().length;
  if (k === 'ArrowUp' || k === 'w' || k === 'W') { menu.idx = (menu.idx + n - 1) % n; SFX.swap(); }
  else if (k === 'ArrowDown' || k === 's' || k === 'S') { menu.idx = (menu.idx + 1) % n; SFX.swap(); }
  else if (k === 'Enter' || k === ' ' || k === 'z' || k === 'Z') menuSelect(menu.idx);
}
function drawTitleUI() {
  const bob = Math.sin(titleAnim * 0.8) * 2, sc = 1 + Math.sin(titleAnim * 0.6) * 0.02;
  text('伊布 · 进化大冒险', CW / 2, 14 + bob, 24 * sc, '#ffd23c', 'center', '#3a2008');
  text('银河恶魔城版', CW / 2, 46 + bob, 9, '#ffffff', 'center');
  const items = menuItems();
  items.forEach((m, i) => {
    const hov = Math.abs(mouse.x - CW / 2) < 60 && mouse.y >= MENU_Y - 2 + i * 17 && mouse.y <= MENU_Y + 12 + i * 17;
    if (hov && menu.idx !== i) menu.idx = i;
    const sel = menu.idx === i, size = sel ? 12 + Math.sin(frame / 10) * 0.6 : 10;
    text(m, CW / 2, MENU_Y + i * 17 - (sel ? 1 : 0), size, sel ? '#ffe14a' : '#e8e8f0', 'center', '#1a1020');
  });
  text('v0.4 开发中', 5, CH - 10, 6, '#ffffff');
  if (menu.help) {
    U.box(CW / 2 - 120, 40, 240, 132, 4, 'rgba(40,52,128,0.94)', 'rgba(12,16,48,0.95)', 1.2);
    text('操作说明', CW / 2, 46, 10, '#ffe96a', 'center');
    [['← → / A D', '移动'], ['空格 / ↑ / W', '跳跃（按住跳更高）'], ['X / J / K', '使用当前形态的技能'], ['1～9 / Tab / 点物品栏', '切换形态'], ['Esc / I / E', '背包'], ['M', '地图（方向键移动，+ - 缩放）'], ['存档石', '碰一下回满血并存档']].forEach((l, i) => { text(l[0], CW / 2 - 108, 64 + i * 13, 7.5, '#ffe6a0'); text(l[1], CW / 2 - 18, 64 + i * 13, 7.5, '#ffffff'); });
    text('按任意键返回', CW / 2, 158, 7, '#a0a8d0', 'center');
  }
}

// ---------------- 主循环 ----------------
function update() {
  frame++;
  if (mapToggle) { mapToggle = false; if (state === 'play') { state = 'map'; mapView.cx = (player.x + player.w / 2) / T; mapView.cy = (player.y + player.h / 2) / T; mapDirty = true; } else if (state === 'map') state = 'play'; }
  if (invToggle) { invToggle = false; if (state === 'play') state = 'inv'; else if (state === 'inv') state = 'play'; }
  if (state === 'map') { const sp = 3 / mapView.zoom; if (left()) mapView.cx -= sp; if (right()) mapView.cx += sp; if (keys.ArrowUp || keys.w || keys.W) mapView.cy -= sp; if (keys.ArrowDown || keys.s || keys.S) mapView.cy += sp; mapView.cx = Math.max(0, Math.min(TWd, mapView.cx)); mapView.cy = Math.max(0, Math.min(THt, mapView.cy)); }
  for (const c of chat) c.t++; chat = chat.filter(c => c.t < 420);
  if (formNext) { formNext = false; cycleForm(); }
  if (state === 'play') { updatePlayer(); updateEnemies(); updateProjectiles(); }
  else if (state === 'evolving') {
    evo.t++;
    if (evo.t === 50) {
      player.form = evo.to; if (evo.shiny) G.shiny[evo.to] = true; player.shiny = !!G.shiny[evo.to];
      if (evo.shiny) { SFX.shiny(); shinyFx = { x: player.x + player.w / 2, y: player.y + player.h / 2 - 4, t: 0 }; floaters.push({ x: player.x + player.w / 2, y: player.y - 14, text: '✨ 闪光！', life: 90, color: '#ffe96a' }); }
    }
    if (evo.t % 3 === 0) particles.push({ x: player.x + player.w / 2 + (Math.random() - .5) * 24, y: player.y + player.h - Math.random() * 24, vx: (Math.random() - .5) * 0.4, vy: -0.4 - Math.random() * 0.8, life: 40, color: ['#fff', '#ffe14a', FORMS[evo.to].color][evo.t % 3] });
    if (evo.t > 120) { state = 'play'; jumpQueued = false; }
  } else if (state === 'dead') {
    deathTimer++; player.vy += GRAVITY; player.y += player.vy;
    if (deathTimer > 70) respawnAtSave();
  }
  if (state !== 'title' && state !== 'loading' && state !== 'map' && state !== 'inv') { updateBurning(); updateShinyFx(); updateParticles(); clampCam(false); }
}
function draw() {
  uctx.clearRect(0, 0, ui.width, ui.height);
  if (state === 'loading') { px(0, 0, CW, CH, '#0f1024'); text('加载中…', CW / 2, CH / 2 - 6, 10, '#fff', 'center'); return; }
  if (state === 'title') {
    titleAnim += 0.08; frame++;
    px(0, 0, CW, CH, '#6fbfff'); px(0, 100, CW, CH - 100, '#8fd0ff');
    for (let x = 0; x < CW; x += 16) { blit('tiles/grass_top', x, 10 * T); for (let y = 11; y < 14; y++) blit('tiles/dirt', x, y * T); }
    blit('deco/bush', 300, 10 * T - 10); blit('deco/tree', 30, 10 * T - 22); blit('deco/cloud_big', 60, 20); blit('deco/cloud_small', 260, 40);
    FORM_ORDER.forEach((f, i) => { const x = 22 + i * 42, y = 10 * T - Math.round(Math.abs(Math.sin(titleAnim + i * 0.5)) * 6); const im = charSprite(f, false, 1); if (im) ctx.drawImage(im, x - Math.floor(im.width / 2), y - im.height); text(FORMS[f].name, x, 10 * T + 8, 7, '#fff', 'center'); });
    drawTitleUI();
    return;
  }
  drawBackground(); drawLevel(); drawPlayer(); drawWater();
  if (shinyFx) {
    const f = shinyFx, cx = R(f.x - camX), cy = R(f.y - camY);
    if (f.t < 6) { ctx.globalAlpha = 0.8 - f.t * 0.13; px(0, 0, CW, CH, '#fff'); }
    ctx.globalAlpha = Math.max(0, 1 - f.t / 45) * 0.9; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, 4 + f.t * 1.6, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = '#ffe96a'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(cx, cy, 2 + f.t * 1.1, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1;
  }
  drawProjectiles(); drawParticles(); drawHUD();
  if (state === 'evolving') {
    const t = evo.t, flash = t > 40 && t < 60 ? 1 - Math.abs(t - 50) / 10 : 0;
    ctx.globalAlpha = flash * 0.9; px(0, 0, CW, CH, '#fff'); ctx.globalAlpha = 1;
    const m = t < 50 ? '咦？伊布的样子……' : `${FORMS[evo.from].name} 进化成了 ${FORMS[evo.to].name}！`;
    text(m, CW / 2, 60, 14, t < 50 ? '#fff' : '#ffd23c', 'center');
    if (t >= 50) { text('新能力：' + FORMS[evo.to].ability + '   技能（X）：' + FORMS[evo.to].skill, CW / 2, 80, 9, '#fff', 'center'); text('按 ' + (FORM_ORDER.indexOf(evo.to) + 1) + ' 随时切换形态', CW / 2, 94, 8, '#dfe7ff', 'center'); }
  }
  if (state === 'map') drawMapScreen();
  if (state === 'dead' && deathTimer > 20) { ctx.globalAlpha = Math.min(0.6, (deathTimer - 20) / 40); px(0, 0, CW, CH, '#1a0006'); ctx.globalAlpha = Math.min(1, (deathTimer - 20) / 20); text('伊布倒下了……', CW / 2, CH / 2 - 22, 18, '#e03c3c', 'center', '#200004'); text('回到存档石  ' + Math.max(0, Math.ceil((70 - deathTimer) / 60 * 3)), CW / 2, CH / 2 + 4, 9, '#ffffff', 'center'); ctx.globalAlpha = 1; }
}
let last = 0, acc = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  if (!last) last = ts;
  acc += Math.min(100, ts - last); last = ts;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  draw();
}
function fit() {
  const raw = Math.min(window.innerWidth / CW, window.innerHeight / CH);
  const s = raw >= 2 ? Math.floor(raw) : raw;
  const w = Math.floor(CW * s), h = Math.floor(CH * s);
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px'; ui.style.width = w + 'px'; ui.style.height = h + 'px';
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  ui.width = Math.round(w * dpr); ui.height = Math.round(h * dpr); UIS = ui.width / CW;
}
window.addEventListener('resize', fit); window.addEventListener('orientationchange', () => setTimeout(fit, 100)); fit();
G = newProgress(); buildGrid();
loadAssets(() => { state = 'title'; });
requestAnimationFrame(loop);
</script>
