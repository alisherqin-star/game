<title>伊布马里奥 · 进化大冒险</title>
<style>
  html, body { margin: 0; padding: 0; background: #0f1024; height: 100%; overflow: hidden; touch-action: none;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; }
  #c { display: block; background: #000; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
  #ui { position: absolute; left: 0; top: 0; pointer-events: none; }
  #touch { position: fixed; inset: 0; pointer-events: none; display: none; }
  @media (hover: none) and (pointer: coarse) { #touch { display: block; } }
  .btn { position: absolute; bottom: max(18px, env(safe-area-inset-bottom)); width: 64px; height: 64px; background: rgba(255,255,255,.18);
    border: 3px solid rgba(255,255,255,.75); color: #fff; font-size: 24px; font-weight: bold; display: flex; align-items: center; justify-content: center;
    pointer-events: auto; touch-action: none; }
  .btn:active, .btn.on { background: rgba(255,255,255,.5); }
  #bL { left: max(18px, env(safe-area-inset-left)); } #bR { left: calc(max(18px, env(safe-area-inset-left)) + 80px); }
  #bJ { right: max(18px, env(safe-area-inset-right)); width: 84px; height: 84px; }
  #rotate { position: fixed; inset: 0; background: #0f1024; color: #fff; display: none; flex-direction: column; align-items: center; justify-content: center; font-size: 20px; z-index: 10; text-align: center; line-height: 1.8; }

</style>

  const keys = Object.keys(ASSET_PNG); assetsLeft = keys.length;
  if (!assetsLeft) return done();
  for (const k of keys) {
    const img = new Image();
    img.onload = () => {
      const make = (flip) => { const c = document.createElement('canvas'); c.width = img.width; c.height = img.height; const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
        if (flip) { g.translate(img.width, 0); g.scale(-1, 1); } g.drawImage(img, 0, 0); return c; };
      IMG[k] = make(false); if (k.startsWith('characters/') || k.startsWith('enemies/')) IMGF[k] = make(true);

    img.onerror = () => { if (--assetsLeft === 0) done(); };
    img.src = ASSET_PNG[k];
  }
}

  // 背景装饰：确定性伪随机，放在空旷的草地上
  let seed = 7; const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  const busy = new Set(); signs.forEach(s => { for (let d = -2; d <= 2; d++) busy.add(s.x + d); }); foods.forEach(f => { for (let d = -1; d <= 1; d++) busy.add(Math.floor(f.x / T) + d); });

let actx = null;
function beep(freq, dur = 0.08, type = 'square', vol = 0.08, slide = 0) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, actx.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), actx.currentTime + dur);
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
  } catch (e) { }
}
const SFX = {
  jump: () => beep(420, 0.12, 'square', 0.06, 300),

  eat: () => beep(300, 0.15, 'triangle', 0.1, 200),
  evolve: () => [0, 1, 2, 3, 4].forEach(i => setTimeout(() => beep(500 + i * 150, 0.2, 'triangle', 0.08), i * 110)),
  hurt: () => beep(200, 0.25, 'sawtooth', 0.08, -120),

  die: () => [0, 1, 2].forEach(i => setTimeout(() => beep(300 - i * 80, 0.25, 'square', 0.07), i * 180)),
  charm: () => { beep(900, 0.1, 'sine', 0.07); setTimeout(() => beep(1300, 0.15, 'sine', 0.07), 80); },
  shiny: () => {
    // 仿正作闪光音：一串快速上行的星星叮铃声，最后一个长音带颤音
    const seq = [1319, 1760, 2093, 2637, 2093, 2637, 3136, 3520];

    setTimeout(() => {
      try {
        const o = actx.createOscillator(), g = actx.createGain(), v = actx.createOscillator(), vg = actx.createGain();
        o.type = 'sine'; o.frequency.value = 4186; v.frequency.value = 9; vg.gain.value = 40; v.connect(vg); vg.connect(o.frequency);
        g.gain.setValueAtTime(0.07, actx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.7);
        o.connect(g); g.connect(actx.destination); o.start(); v.start(); o.stop(actx.currentTime + 0.7); v.stop(actx.currentTime + 0.7);
      } catch (e) { }
    }, seq.length * 55);
  },
};

window.addEventListener('keydown', e => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
  if (e.repeat) return;
  keys[e.key] = true;
  if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === 'z') jumpQueued = true;
  if (e.key === 'r' || e.key === 'R') { if (state !== 'title' && state !== 'loading') { resetGame(); state = 'play'; return; } }
  anyStart();
});
window.addEventListener('keyup', e => { keys[e.key] = false; });
const bind = (id, key) => {
  const el = document.getElementById(id);
  const down = e => { e.preventDefault(); keys[key] = true; el.classList.add('on'); if (key === ' ') jumpQueued = true; anyStart(); };

  blit('ui/coin_0', 56, 6); text('' + coinCount, 66, 5, 9, '#ffd84a', 'left', null);
  text('分数 ' + score, 88, 5, 9, '#fff', 'left', null);
  px(7, 18, 8, 8, FORMS[player.form].color);
  text(FORMS[player.form].name + (player.shiny ? ' ✨' : ''), 18, 17, 9, player.shiny ? '#ffe96a' : '#fff', 'left', null);
  text(FORMS[player.form].ability, 56, 18, 7, '#cfd8ff', 'left', null);
  panel(CW - 3 - 8 * 15 - 6, 3, 8 * 15 + 6, 22);
  FORM_ORDER.forEach((f, i) => {
    const x = CW - 3 - 8 * 15 - 6 + 4 + i * 15, got = discovered[f];
    px(x, 6, 10, 8, got ? FORMS[f].color : '#3a3050');
    if (player.form === f) { px(x - 1, 5, 12, 1, '#fff'); px(x - 1, 14, 12, 1, '#fff'); px(x - 1, 5, 1, 10, '#fff'); px(x + 10, 5, 1, 10, '#fff'); }
    text(got ? FORMS[f].name.replace('伊布', '') : '?', x + 5, 15, 7, got ? '#fff' : '#8a80a0', 'center', null);
    if (discoveredShiny[f]) text('✦', x + 10, 2, 6, '#ffe96a', 'center', null);
  });
  for (const s of signs) {
    if (Math.abs(s.x * T + 8 - (player.x + player.w / 2)) < 44) {
      const w = Math.ceil(textWidth(s.text, 9)) + 12;
      const bx = Math.max(4, Math.min(CW - w - 4, R(s.x * T + 8 - camX - w / 2))), by = 10 * T - 40;
      px(bx, by, w, 16, '#4a2a10'); px(bx + 1, by + 1, w - 2, 14, '#fff4d8');
      text(s.text, bx + 6, by + 3, 9, '#4a2a10', 'left', null);
    }
  }
  for (const f of floaters) { ctx.globalAlpha = Math.min(1, f.life / 15); text(f.text, f.x - camX, f.y - 8, 8, f.color, 'center'); }
  ctx.globalAlpha = 1;
}
function drawOverlay(title, lines, sub) {
  ctx.globalAlpha = 0.75; px(0, 0, CW, CH, '#0a0a28'); ctx.globalAlpha = 1;
  text(title, CW / 2, 40, 24, '#fff', 'center');
  lines.forEach((l, i) => text(l, CW / 2, 80 + i * 16, 10, '#fff', 'center'));
  if (sub) text(sub, CW / 2, CH - 30, 10, (frame >> 4) & 1 ? '#ffd23c' : '#fff', 'center');
}

// ---------------- 主循环 ----------------
function update() {
  frame++;
  if (state === 'play') { updatePlayer(); updateEnemies(); }
  else if (state === 'evolving') {
    evo.t++;
    if (evo.t === 50) {
      player.form = evo.to; player.shiny = evo.shiny; discovered[evo.to] = true;
      if (evo.shiny) {
        discoveredShiny[evo.to] = true; score += 300; SFX.shiny();
        shinyFx = { x: player.x + player.w / 2, y: player.y + player.h / 2 - 4, t: 0 };
        floaters.push({ x: player.x + player.w / 2, y: player.y - 14, text: '✨ 闪光！+300', life: 90, color: '#ffe96a' });
      }
    }
    if (evo.t % 3 === 0) particles.push({ x: player.x + player.w / 2 + (Math.random() - .5) * 24, y: player.y + player.h - Math.random() * 24, vx: (Math.random() - .5) * 0.4, vy: -0.4 - Math.random() * 0.8, life: 40, color: ['#fff', '#ffe14a', FORMS[evo.to].color][evo.t % 3] });
    if (evo.shiny && evo.t > 50 && evo.t % 2 === 0) particles.push({ x: player.x + player.w / 2 + (Math.random() - .5) * 36, y: player.y + player.h - Math.random() * 30, vx: (Math.random() - .5) * 0.4, vy: -0.3 - Math.random() * 0.6, life: 30, color: ['#fff', '#ffe96a', '#9fe8ff'][evo.t % 3], star: true });
    if (evo.t > 120) { state = 'play'; jumpQueued = false; }
  } else if (state === 'dead') {
    deathTimer++;
    player.vy += GRAVITY; player.y += player.vy;
    if (deathTimer > 70) { if (lives > 0) respawn(); else state = 'over'; }
  }
  updateBurning();
  updateShinyFx();
  updateParticles();
  const targetCam = player.x + player.w / 2 - CW * 0.4;
  camX += (targetCam - camX) * 0.12;
  camX = Math.max(0, Math.min(LW * T - CW, camX));
}
let titleAnim = 0;
function draw() {
  uctx.clearRect(0, 0, ui.width, ui.height);
  if (state === 'loading') { px(0, 0, CW, CH, '#0f1024'); text('加载中…', CW / 2, CH / 2 - 6, 10, '#fff', 'center'); return; }
  if (state === 'title') {
    titleAnim += 0.08; camX = 0;
    drawBackground();
    for (let x = 0; x < CW; x += 16) { blit('tiles/grass_top', x, 10 * T); for (let y = 11; y < H; y++) blit('tiles/dirt', x, y * T); }
    blit('deco/bush', 300, 10 * T - 10); blit('deco/tree', 30, 10 * T - 22);
    ['eevee', ...FORM_ORDER].forEach((f, i) => {
      const x = 22 + i * 42, y = 10 * T - Math.round(Math.abs(Math.sin(titleAnim + i * 0.5)) * 6);
      const im = charSprite(f, false, 1); if (im) ctx.drawImage(im, x - Math.floor(im.width / 2), y - im.height);
      text(FORMS[f].name, x, 10 * T + 8, 7, '#fff', 'center');
    });
    text('伊布马里奥', CW / 2, 30, 28, '#ffd23c', 'center');
    text('进化大冒险', CW / 2, 64, 12, '#fff', 'center');
    text('吃下不同的食物，伊布会进化成不同的形态', CW / 2, 92, 9, '#fff', 'center');
    text('← → / A D 移动   空格 / ↑ / W 跳跃   R 重新开始', CW / 2, 106, 8, '#dfe7ff', 'center');
    text('按任意键 / 点击屏幕开始', CW / 2, 128, 10, (frame >> 4) & 1 ? '#fff' : '#ffd23c', 'center');
    return;
  }
  drawBackground();
  drawLevel();
  drawPlayer();
  drawWater();
  if (shinyFx) {
    const f = shinyFx, cx = R(f.x - camX), cy = R(f.y);
    if (f.t < 6) { ctx.globalAlpha = 0.8 - f.t * 0.13; px(0, 0, CW, CH, '#fff'); }
    ctx.globalAlpha = Math.max(0, 1 - f.t / 45) * 0.9; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, 4 + f.t * 1.6, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = '#ffe96a'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(cx, cy, 2 + f.t * 1.1, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  drawParticles();
  drawHUD();
  if (state === 'evolving') {
    const t = evo.t;
    const flash = t > 40 && t < 60 ? 1 - Math.abs(t - 50) / 10 : 0;
    ctx.globalAlpha = flash * 0.9; px(0, 0, CW, CH, '#fff'); ctx.globalAlpha = 1;
    const msg = t < 50 ? '咦？伊布的样子……' : `${FORMS[evo.from].name} 进化成了 ${FORMS[evo.to].name}！`;
    text(msg, CW / 2, 44, 14, t < 50 ? '#fff' : '#ffd23c', 'center');
    if (t >= 50) text('新能力：' + FORMS[evo.to].ability, CW / 2, 64, 9, '#fff', 'center');
  }
  if (state === 'over') drawOverlay('游戏结束', ['分数 ' + score, '发现了 ' + Object.keys(discovered).length + ' / 9 种伊布'], '按任意键回到标题');
  if (state === 'win') {
    const secs = Math.round((timeEnd - timeStart) / 1000);
    drawOverlay('通关！', ['分数 ' + score + '   用时 ' + secs + ' 秒', '金币 ' + coinCount + '   发现了 ' + Object.keys(discovered).length + ' / 9 种伊布   闪光 ' + Object.keys(discoveredShiny).length + ' 只', '伊布和它的所有进化形态一起抵达了终点！'], '按任意键回到标题');
    ['eevee', ...FORM_ORDER].forEach((f, i) => { if (discovered[f]) { const im = charSprite(f, !!discoveredShiny[f], 1); if (im) ctx.drawImage(im, 22 + i * 42 - Math.floor(im.width / 2), 164 - im.height - ((frame >> 3) + i) % 2); } });
  }
}
let last = 0, acc = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  if (!last) last = ts;
  acc += Math.min(100, ts - last); last = ts;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  draw();
}
function fit() {
  const raw = Math.min(window.innerWidth / CW, window.innerHeight / CH);
  const s = raw >= 2 ? Math.floor(raw) : raw;
  const w = Math.floor(CW * s), h = Math.floor(CH * s);
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  ui.style.width = w + 'px'; ui.style.height = h + 'px';
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  ui.width = Math.round(w * dpr); ui.height = Math.round(h * dpr);
  UIS = ui.width / CW;
}
window.addEventListener('resize', fit); window.addEventListener('orientationchange', () => setTimeout(fit, 100)); fit();
resetGame();
loadAssets(() => { state = 'title'; });
requestAnimationFrame(loop);
</script>
